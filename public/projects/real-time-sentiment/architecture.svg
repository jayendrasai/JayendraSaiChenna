<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time AI Sentiment Analysis architecture</title>
  <desc id="desc">React dashboard events flow through Node.js and WebSockets into Redis Streams, Python sentiment inference, and PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fafaf9" />
  <text x="48" y="54" fill="#1c1917" font-family="Arial, sans-serif" font-size="26" font-weight="700">Real-Time AI Sentiment Analysis</text>
  <text x="48" y="82" fill="#78716c" font-family="Arial, sans-serif" font-size="15">Event-driven analytics with live WebSocket delivery</text>

  <rect x="48" y="128" width="190" height="116" rx="14" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2" />
  <text x="143" y="166" text-anchor="middle" fill="#1c1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">React dashboard</text>
  <text x="143" y="195" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">live sentiment view</text>
  <text x="143" y="219" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">WebSocket client</text>

  <rect x="306" y="128" width="190" height="116" rx="14" fill="#e7e5e4" stroke="#c2410c" stroke-width="2" />
  <text x="401" y="166" text-anchor="middle" fill="#1c1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">Node.js service</text>
  <text x="401" y="195" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">event gateway</text>
  <text x="401" y="219" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">WebSocket broadcast</text>

  <rect x="564" y="128" width="348" height="116" rx="14" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2" />
  <text x="738" y="166" text-anchor="middle" fill="#1c1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">Redis Streams</text>
  <text x="738" y="195" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">fault-tolerant event pipeline</text>
  <text x="738" y="219" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">ordered sentiment events</text>

  <line x1="238" y1="186" x2="306" y2="186" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="496" y1="186" x2="564" y2="186" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="178" y="334" width="260" height="126" rx="14" fill="#e7e5e4" stroke="#c2410c" stroke-width="2" />
  <text x="308" y="374" text-anchor="middle" fill="#1c1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">Python inference</text>
  <text x="308" y="404" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">DistilBERT / RoBERTa</text>
  <text x="308" y="430" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">sentiment classification</text>

  <rect x="522" y="334" width="260" height="126" rx="14" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2" />
  <text x="652" y="374" text-anchor="middle" fill="#1c1917" font-family="Arial, sans-serif" font-size="18" font-weight="700">PostgreSQL</text>
  <text x="652" y="404" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">durable analytics history</text>
  <text x="652" y="430" text-anchor="middle" fill="#78716c" font-family="Arial, sans-serif" font-size="14">containerized persistence</text>

  <line x1="690" y1="244" x2="438" y2="334" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="786" y1="244" x2="710" y2="334" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="438" y1="397" x2="522" y2="397" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="48" y="502" width="864" height="1" fill="#d6d3d1" />
  <text x="48" y="532" fill="#c2410c" font-family="monospace" font-size="13" letter-spacing="1">REDIS STREAMS / INFERENCE / WEBSOCKET DASHBOARD</text>
</svg>
