<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time Chat Application architecture</title>
  <desc id="desc">A React client connects through Express and WebSockets to authenticated Libsodium-encrypted messaging backed by MongoDB Atlas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fffdf8" />
  <text x="48" y="54" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Real-Time Chat Application</text>
  <text x="48" y="82" fill="#6f675d" font-family="Arial, sans-serif" font-size="15">Secure messaging with private channels and end-to-end encryption</text>

  <rect x="48" y="142" width="190" height="118" rx="14" fill="#f3ebdd" stroke="#d8cfc2" stroke-width="2" />
  <text x="143" y="181" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="700">React client</text>
  <text x="143" y="211" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">private messaging UI</text>
  <text x="143" y="237" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">key exchange client</text>

  <rect x="306" y="142" width="190" height="118" rx="14" fill="#fff6db" stroke="#ff8c42" stroke-width="2" />
  <text x="401" y="181" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Express.js</text>
  <text x="401" y="211" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">WebSocket boundary</text>
  <text x="401" y="237" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">authenticated sessions</text>

  <rect x="564" y="142" width="348" height="118" rx="14" fill="#f3ebdd" stroke="#d8cfc2" stroke-width="2" />
  <text x="738" y="181" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Libsodium encryption</text>
  <text x="738" y="211" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">key exchange</text>
  <text x="738" y="237" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">end-to-end message protection</text>

  <line x1="238" y1="201" x2="306" y2="201" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="496" y1="201" x2="564" y2="201" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="178" y="350" width="260" height="118" rx="14" fill="#f3ebdd" stroke="#d8cfc2" stroke-width="2" />
  <text x="308" y="389" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Private channels</text>
  <text x="308" y="419" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">one-to-one messaging</text>
  <text x="308" y="445" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">real-time synchronization</text>

  <rect x="522" y="350" width="260" height="118" rx="14" fill="#fff6db" stroke="#ff8c42" stroke-width="2" />
  <text x="652" y="389" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="700">MongoDB Atlas</text>
  <text x="652" y="419" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">message persistence</text>
  <text x="652" y="445" text-anchor="middle" fill="#6f675d" font-family="Arial, sans-serif" font-size="14">conversation state</text>

  <line x1="690" y1="260" x2="438" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="786" y1="260" x2="710" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="438" y1="409" x2="522" y2="409" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="48" y="510" width="864" height="1" fill="#d8cfc2" />
  <text x="48" y="538" fill="#ff8c42" font-family="monospace" font-size="13" letter-spacing="1">AUTHENTICATION / KEY EXCHANGE / PRIVATE MESSAGING</text>
</svg>
